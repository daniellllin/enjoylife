<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23174f3c'/%3E%3Cpath d='M20 34 29 43 46 22' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta name="robots" content="noindex,nofollow">
  <title>一起走走 · 示範版</title>
  <meta name="description" content="一起走走的公開互動示範版。全部使用虛構資料，不登入、不連外部服務。">
  <meta property="og:title" content="一起走走 · 示範版">
  <meta property="og:description" content="用虛構資料操作收藏、地圖與走訪日誌。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://daniellllin.github.io/enjoylife/og-demo.png">
  <style>
    :root{--ink:#19221f;--green:#174f3c;--green-2:#246a52;--paper:#fff;--wash:#f4f5ef;--line:#d9ddd6;--muted:#69716d;--shadow:0 18px 50px #24372d18;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--ink);font-family:var(--sans)}body{margin:0}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #78aa96;outline-offset:3px}a{color:inherit;text-underline-offset:4px}.demo-bar{min-height:44px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:9px 26px;font-size:13px;letter-spacing:.02em}.demo-bar a{font-weight:700;text-decoration:none}.app{min-height:calc(100vh - 44px);display:grid;grid-template-columns:232px minmax(0,1fr)}.sidebar{border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 44px);background:#fff}.brand{font-family:var(--serif);color:var(--green);font-weight:800;font-size:30px;letter-spacing:.08em}.brand small{display:block;font:italic 15px/1.5 Georgia,serif;letter-spacing:.18em;margin-top:2px}.nav{display:grid;gap:7px;margin-top:46px}.nav button{border:0;background:transparent;text-align:left;border-radius:5px;padding:13px 14px;font-weight:650;display:flex;align-items:center;gap:12px}.nav button.active{background:#eef2ed;color:var(--green);box-shadow:inset 3px 0 var(--green)}.sidebar-note{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);font-size:12px;line-height:1.7;color:var(--muted)}main{padding:42px clamp(24px,4vw,64px) 80px;min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:28px}.top h1{font:800 clamp(30px,3vw,44px)/1.18 var(--serif);margin:0;letter-spacing:-.03em}.top p{color:var(--muted);margin:10px 0 0;line-height:1.7}.primary,.outline{border-radius:4px;min-height:44px;padding:10px 17px;font-weight:700;border:1px solid var(--green);transition:.16s}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green-2)}.outline{background:#fff;color:var(--green)}.quick{margin:32px 0 26px;border:1px solid var(--line);display:flex;gap:12px;padding:12px;background:#fff}.quick input{border:0;min-width:0;flex:1;padding:0 8px;outline:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);margin-bottom:0}.tabs{display:flex;gap:28px}.tabs button{border:0;background:transparent;padding:14px 2px;color:var(--muted);border-bottom:3px solid transparent}.tabs button.active{color:var(--green);border-color:var(--green);font-weight:800}.search{border:1px solid var(--line);padding:10px 12px;min-width:250px;margin-bottom:8px}.workspace{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(390px,1.1fr);border:1px solid var(--line);border-top:0;min-height:520px}.list{border-right:1px solid var(--line)}.place{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:20px;display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center}.place:hover,.place.active{background:#f7f8f4}.place.active{box-shadow:inset 3px 0 var(--green)}.place img{width:92px;height:68px;object-fit:cover;border-radius:4px}.place strong{display:block;font-family:var(--serif);font-size:19px;margin-bottom:6px}.meta,.note{font-size:13px;color:var(--muted);line-height:1.55}.state{font-size:12px;color:var(--green);white-space:nowrap}.detail{padding:38px clamp(24px,4vw,52px)}.detail h2{font:800 clamp(30px,3.4vw,48px)/1.15 var(--serif);margin:0 0 12px}.detail-photo{width:100%;height:230px;object-fit:cover;margin:24px 0;border-radius:4px}.rule{border-top:1px solid var(--line);padding-top:22px;margin-top:24px}.rule h3{font:800 18px var(--serif);margin:0 0 12px}.visit{display:grid;grid-template-columns:14px 1fr;gap:14px}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);margin-top:5px}.review{background:var(--wash);padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.65}.empty{padding:36px;color:var(--muted)}.map-panel{min-height:540px;border:1px solid var(--line);margin-top:26px;position:relative;overflow:hidden;background:linear-gradient(90deg,transparent 49.5%,#dfe4dc 50%,transparent 50.5%),linear-gradient(0deg,transparent 49.5%,#dfe4dc 50%,transparent 50.5%),#f4f5ef;background-size:120px 120px}.road{position:absolute;background:#fff;border:1px solid #e1e4de;transform-origin:left center}.road.a{height:25px;width:115%;left:-5%;top:42%;transform:rotate(-8deg)}.road.b{height:20px;width:92%;left:7%;top:66%;transform:rotate(18deg)}.road.c{height:18px;width:88%;left:42%;top:-5%;transform:rotate(82deg)}.pin{position:absolute;width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--green);border:4px solid white;box-shadow:0 8px 20px #1f3d3060}.pin::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;left:12px;top:12px}.pin span{position:absolute;transform:rotate(45deg);left:34px;top:35px;background:#fff;border:1px solid var(--line);padding:6px 8px;white-space:nowrap;font-size:12px;box-shadow:var(--shadow)}.journal{margin-top:28px;border-top:1px solid var(--line)}.journal-row{display:grid;grid-template-columns:130px 160px 1fr;gap:22px;padding:26px 0;border-bottom:1px solid var(--line)}.journal-row time{font:700 20px var(--serif)}.journal-row img{width:160px;height:104px;object-fit:cover;border-radius:4px}.journal-row h3{margin:0 0 8px;font:800 22px var(--serif)}.journal-row p{margin:0;color:var(--muted);line-height:1.7}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#173e31;color:#fff;padding:12px 18px;border-radius:4px;box-shadow:var(--shadow);font-size:13px;z-index:10}.mobile-head{display:none}
    .mobile-nav{display:none}@media(max-width:780px){.demo-bar{padding:9px 16px}.demo-bar span{max-width:70%;line-height:1.45}.app{display:block}.sidebar{display:none}.mobile-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0}.mobile-head .brand{font-size:22px}.mobile-head .brand small{display:inline;margin-left:8px;font-size:12px}.mobile-nav{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:4}.mobile-nav button{flex:1;border:0;background:#fff;padding:13px 5px}.mobile-nav button.active{color:var(--green);box-shadow:inset 0 -3px var(--green);font-weight:800}main{padding:25px 18px 70px}.top{display:block}.top .primary{margin-top:18px}.quick{margin-top:24px}.toolbar{display:block}.tabs{overflow:auto}.search{width:100%;min-width:0}.workspace{display:block;border-top:1px solid var(--line)}.list{border:0}.place{grid-template-columns:76px 1fr auto;padding:14px}.place img{width:76px;height:60px}.detail{padding:30px 20px}.detail-photo{height:190px}.map-panel{min-height:470px}.journal-row{grid-template-columns:1fr}.journal-row img{width:100%;height:190px}.journal-row time{font-size:15px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
  </style>
</head>
<body>
  <div class="demo-bar"><span>示範版 · 資料是虛構的，重新整理就還原</span><a href="../showcase/">作品介紹 →</a></div>
  <div class="mobile-head"><div class="brand">一起走走 <small>enjoy life</small></div></div>
  <div class="mobile-nav" aria-label="主要功能"><button data-view="places" class="active">收藏</button><button data-view="map">地圖</button><button data-view="journal">日誌</button></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">一起走走<small>enjoy life</small></div>
      <nav class="nav" aria-label="主要功能"><button data-view="places" class="active">▰ 我的收藏</button><button data-view="map">⌖ 地圖檢視</button><button data-view="journal">□ 到訪日誌</button></nav>
      <p class="sidebar-note">作品集示範模式<br>不登入、不儲存、不呼叫外部 API。</p>
    </aside>
    <main>
      <section id="places" class="view">
        <div class="top"><div><h1>把想去的地方，留給我們。</h1><p>先收藏，再一起決定下一站。</p></div><button class="primary" id="add">＋ 新增虛構收藏</button></div>
        <form class="quick" id="quick"><input aria-label="收藏連結" placeholder="貼上社群連結，先把靈感收好"><button class="outline">收藏連結</button></form>
        <div class="toolbar"><div class="tabs" aria-label="收藏狀態"><button data-filter="all" class="active">全部</button><button data-filter="want">想去</button><button data-filter="again">想再訪</button><button data-filter="visited">已到訪</button></div><input class="search" id="search" type="search" placeholder="搜尋收藏" aria-label="搜尋收藏"></div>
        <div class="workspace"><div class="list" id="list"></div><article class="detail" id="detail"></article></div>
      </section>
      <section id="map" class="view" hidden><div class="top"><div><h1>把清單放回地圖上。</h1><p>這裡是純前端示意圖，不會要求定位或載入地圖服務。</p></div></div><div class="map-panel" aria-label="虛構地圖"><i class="road a"></i><i class="road b"></i><i class="road c"></i><i class="pin" style="left:24%;top:30%"><span>森日咖啡</span></i><i class="pin" style="left:62%;top:58%"><span>海邊散步</span></i><i class="pin" style="left:75%;top:20%"><span>山間茶屋</span></i></div></section>
      <section id="journal" class="view" hidden><div class="top"><div><h1>走過的地方，留下兩個人的版本。</h1><p>每次到訪各自保留，不用把感受合併成一個答案。</p></div></div><div class="journal" id="journal-list"></div></section>
    </main>
  </div>
  <script>
    const places=[
      {id:1,name:"森日咖啡",area:"臺北市 · 大安區",type:"咖啡",status:"want",statusText:"想去",reason:"想找個午後，和你一起坐在窗邊。",source:"Instagram",image:"../images/demo-cafe.png"},
      {id:2,name:"海邊散步",area:"新北市 · 瑞芳區",type:"散步",status:"again",statusText:"想再訪",reason:"想在海邊吹風，看著日落。",source:"Facebook",image:"../images/demo-coast.png",visit:{date:"2026.08.17",cost:"NT$ 680 · 兩人總額",me:"風很舒服，下次想走到更遠一點。",her:"傍晚的光很好看，會想再來。"}},
      {id:3,name:"山間茶屋",area:"南投縣 · 魚池鄉",type:"茶屋",status:"visited",statusText:"已到訪",reason:"想上山喝茶，放空一下。",source:"朋友分享",image:"../images/demo-tea.png",visit:{date:"2026.05.02",cost:"NT$ 520 · 兩人總額",me:"茶很好喝，窗外很安靜。",her:"很適合慢慢待一個下午。"}}
    ];
    let filter="all",selected=1;
    const list=document.querySelector("#list"),detail=document.querySelector("#detail"),search=document.querySelector("#search");
    function visible(){const q=search.value.trim().toLowerCase();return places.filter(p=>(filter==="all"||p.status===filter)&&(!q||[p.name,p.area,p.type,p.reason].join(" ").toLowerCase().includes(q)))}
    function paint(){const rows=visible();if(!rows.some(p=>p.id===selected)&&rows[0])selected=rows[0].id;list.innerHTML=rows.map(p=>`<button class="place ${p.id===selected?"active":""}" data-id="${p.id}"><img src="${p.image}" alt=""><span><strong>${p.name}</strong><span class="meta">${p.area}</span><span class="note">${p.reason}</span></span><span class="state">${p.statusText}</span></button>`).join("")||'<p class="empty">找不到符合的收藏。</p>';list.querySelectorAll(".place").forEach(b=>b.onclick=()=>{selected=+b.dataset.id;paint()});const p=places.find(x=>x.id===selected);detail.innerHTML=p?`<h2>${p.name}</h2><p class="meta">${p.area} · ${p.type}</p><img class="detail-photo" src="${p.image}" alt="${p.name}的虛構示範圖片"><div class="rule"><h3>為什麼想去</h3><p>${p.reason}</p><p class="meta">來源：${p.source} · 虛構示範資料</p></div>${p.visit?`<div class="rule"><h3>我們的到訪</h3><div class="visit"><i class="dot"></i><div><strong>${p.visit.date}</strong><p class="meta">${p.visit.cost}</p><div class="review"><b>我</b>　${p.visit.me}</div><div class="review"><b>她</b>　${p.visit.her}</div></div></div></div>`:`<div class="rule"><h3>我們的到訪</h3><p class="meta">還沒有到訪紀錄。</p></div>`}`:""}
    document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));paint()});search.oninput=paint;
    document.querySelector("#quick").onsubmit=e=>{e.preventDefault();toast("已放入待整理（示範，不會儲存）");e.target.reset()};document.querySelector("#add").onclick=()=>toast("示範版不會寫入真實資料");
    function switchView(id){document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!==id);document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===id))}document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
    document.querySelector("#journal-list").innerHTML=places.filter(p=>p.visit).map(p=>`<article class="journal-row"><time>${p.visit.date}</time><img src="${p.image}" alt=""><div><h3>${p.name}</h3><p>${p.visit.me}<br>${p.visit.her}</p></div></article>`).join("");
    function toast(msg){const old=document.querySelector(".toast");if(old)old.remove();const n=document.createElement("div");n.className="toast";n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2600)}paint();
  </script>
</body>
</html>
